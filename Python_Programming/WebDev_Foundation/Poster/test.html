<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motivational Poster - The Chosen One</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="poster-container">
      <div class="poster-inner-border">
        <div class="image-wrapper">
          <img
            src="https://static0.cbrimages.com/wordpress/wp-content/uploads/2024/09/quidditch-cropped.jpg?q=70&fit=crop&w=825&dpr=1"
            alt="Harry Potter - The Chosen One"
          />
        </div>

        <h1 class="title">The Chosen One</h1>

        <div class="divider"></div>

        <p class="quote">
          "It is our choices, Harry, that show what we truly are, far more than
          our abilities."
        </p>
      </div>
    </div>
  </body>
</html>
